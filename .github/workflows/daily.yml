name: Daily forecast archive
on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'site/index.html'
      - '.github/workflows/daily.yml'
  schedule:
    - cron: '5 17,18 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: forecast-publish
  cancel-in-progress: false
jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Eastern time gate
        id: clock
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || [ "$(TZ=America/New_York date +%H)" = "13" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Skipping duplicate UTC cron slot outside 1 PM Eastern"
          fi
      - uses: actions/checkout@v4
        if: steps.clock.outputs.proceed == 'true'
      - uses: actions/setup-python@v5
        if: steps.clock.outputs.proceed == 'true'
        with:
          python-version: '3.12'
      - name: Validate collector and dashboard syntax
        if: steps.clock.outputs.proceed == 'true'
        run: python -m py_compile collect.py collect_observations.py collect_precipitation.py collect_human_candidates.py prepare_human_review.py fetch_human_articles.py collect_websites.py build_dashboard.py collection_health.py
      - name: Run offline integrity tests
        if: steps.clock.outputs.proceed == 'true'
        run: python -m unittest -v test_integrity.py
      - name: Collect model forecasts
        if: steps.clock.outputs.proceed == 'true'
        run: python collect.py
      - name: Fetch observed airport temperatures
        if: steps.clock.outputs.proceed == 'true'
        run: python collect_observations.py
      - name: Fetch hourly airport rainfall
        if: steps.clock.outputs.proceed == 'true'
        run: python collect_precipitation.py
      - name: Capture station websites
        if: steps.clock.outputs.proceed == 'true'
        continue-on-error: true
        run: python collect_websites.py
      - name: Discover Connecticut TV forecast articles
        if: steps.clock.outputs.proceed == 'true'
        continue-on-error: true
        run: python collect_human_candidates.py
      - name: Prepare TV forecast review hints
        if: steps.clock.outputs.proceed == 'true'
        continue-on-error: true
        run: python prepare_human_review.py
      - name: Retrieve article excerpts for review
        if: steps.clock.outputs.proceed == 'true'
        continue-on-error: true
        run: python fetch_human_articles.py
      - name: Build dashboard
        if: steps.clock.outputs.proceed == 'true'
        run: python build_dashboard.py
      - name: Generate collection health report
        if: steps.clock.outputs.proceed == 'true'
        run: python collection_health.py
      - name: Preserve archive and published dashboard data
        if: steps.clock.outputs.proceed == 'true'
        run: |
          git config user.name 'Forecast Archive Bot'
          git config user.email 'forecast-archive-bot@users.noreply.github.com'
          git add data/ site/dashboard-data.json site/collection-health.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive forecasts $(date -u +%F)"
            git push
          fi
      - uses: actions/configure-pages@v5
        if: steps.clock.outputs.proceed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.clock.outputs.proceed == 'true'
        with:
          path: site
      - uses: actions/deploy-pages@v4
        if: steps.clock.outputs.proceed == 'true'
        id: deployment
